# SERVICE NAME
spring.application.name=contact-service

# SERVICE PORT
server.port=8083
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
# MYSQL DATABASE
# ⭐ Production-ready: values can be overridden with environment variables
#    (DB_URL, DB_USERNAME, DB_PASSWORD) on the live server — defaults keep
#    local development working unchanged.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/contact_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Farukh@106}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA SETTINGS
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# OPTIONAL (Recommended for cleaner logs)
spring.jpa.properties.hibernate.format_sql=true

# ═══════════════════════════════════════════════════════════════
# 📧 EMAIL NOTIFICATION (Gmail SMTP)
# ───────────────────────────────────────────────────────────────
# 1. spring.mail.username = YOUR Gmail address (the SENDER account)
# 2. spring.mail.password = 16-character Google APP PASSWORD
#    (NOT your normal Gmail password! See setup instructions.)
# 3. app.mail.to = the ADMIN email that receives enquiry notifications
#    (supports multiple, separated by commas)
# ═══════════════════════════════════════════════════════════════
# ⭐ Production-ready: override with MAIL_USERNAME / MAIL_PASSWORD /
#    MAIL_FROM / MAIL_TO environment variables on the live server.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:farukh07khan@gmail.com}
spring.mail.password=${MAIL_PASSWORD:yqpyaxmitybgviwj}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ── WHO receives the notification & who it's sent from ─────────
app.mail.from=${MAIL_FROM:farukh07khan@gmail.com}
app.mail.to=${MAIL_TO:sunny07kunar@gmail.com}
app.mail.enabled=true
