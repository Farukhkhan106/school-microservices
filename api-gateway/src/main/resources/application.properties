server.port=${PORT:9000}
spring.application.name=api-gateway

# ================================
# EUREKA CLIENT CONFIG
# ================================
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# ================================
# ENABLE DYNAMIC ROUTING BASED ON EUREKA
# ================================
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# ================================
# TOP-LEVEL CONFIGURATION & TENANT ROUTES
# ================================
spring.cloud.gateway.routes[0].id=configuration-route
spring.cloud.gateway.routes[0].uri=lb://auth-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/configuration/**

spring.cloud.gateway.routes[1].id=tenants-route
spring.cloud.gateway.routes[1].uri=lb://auth-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/tenants/**

spring.cloud.gateway.routes[2].id=academic-route
spring.cloud.gateway.routes[2].uri=lb://academic-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/academic/**

spring.cloud.gateway.routes[3].id=workflow-route
spring.cloud.gateway.routes[3].uri=lb://auth-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/workflow/**

spring.cloud.gateway.routes[4].id=dashboard-route
spring.cloud.gateway.routes[4].uri=lb://auth-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/dashboard/**

spring.cloud.gateway.routes[5].id=users-route
spring.cloud.gateway.routes[5].uri=lb://auth-service
spring.cloud.gateway.routes[5].predicates[0]=Path=/users/**

# ================================
# LOGGING
# ================================
logging.level.org.springframework.cloud.gateway=INFO
logging.level.org.springframework.web=INFO

# ================================
# PRODUCTION SECURITY & CORS CONFIG
# ================================
app.cors.allowed-origins=${CORS_ORIGINS:*}
app.jwt.secret=${JWT_SECRET:c3VjY2Vzc19hY2FkZW15X3NlY3VyZV9qd3Rfc2VjcmV0X2tleV8yMDI2X21pbl8zMmNoYXJz}
app.gateway.internal-secret=${GATEWAY_INTERNAL_SECRET:success-academy-secure-internal-gateway-token-2026}
