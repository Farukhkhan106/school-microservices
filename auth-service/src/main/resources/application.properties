# SERVICE NAME & PORT
spring.application.name=auth-service
server.port=${PORT:8084}

# =======================
# EUREKA CONFIG
# =======================
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# =======================
# MYSQL DATABASE
# =======================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/authdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Farukh@106}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =======================
# JPA SETTINGS
# =======================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT SECRET
app.jwt.secret=${JWT_SECRET:MY_SUPER_SECRET_KEY_123456789012345}

spring.h2.console.enabled=false
