server.port=${PORT:8093}
spring.application.name=academic-service

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Database (MySQL)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/academicdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Farukh@106}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Internal Microservice URLs
student.service.url=${STUDENT_SERVICE_URL:http://localhost:8085}
faculty.service.url=${FACULTY_SERVICE_URL:http://localhost:8086}
attendance.service.url=${ATTENDANCE_SERVICE_URL:http://localhost:8088}
