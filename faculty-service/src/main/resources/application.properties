spring.application.name=faculty-service
server.port=${PORT:8086}

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/facultydb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Farukh@106}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# INTER-SERVICE URLS
auth.service.url=${AUTH_SERVICE_URL:http://localhost:8084}

logging.level.org.springframework=INFO
logging.level.com.successacademy.facultyservice=INFO

# ================================
# FILE UPLOAD CONFIG
# ================================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
file.upload-dir=${UPLOAD_DIR:uploads/faculty}
