# ================================
# SERVICE CONFIG
# ================================
spring.application.name=student-service
server.port=8085

# ================================
# EUREKA CLIENT CONFIG
# ================================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# ================================
# MYSQL DATABASE CONFIG
# ================================
spring.datasource.url=jdbc:mysql://localhost:3306/studentdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Farukh@106
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ================================
# JPA HIBERNATE SETTINGS
# ================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# ================================
# LOGGING
# ================================
logging.level.org.springframework=INFO
logging.level.com.successacademy.studentservice=DEBUG

# ================================
# FILE UPLOAD CONFIG
# ================================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
file.upload-dir=uploads/students
