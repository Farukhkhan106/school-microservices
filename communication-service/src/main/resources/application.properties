# ================================
# SERVICE CONFIG
# ================================
spring.application.name=communication-service
server.port=${PORT:8091}

# ================================
# EUREKA CLIENT CONFIG
# ================================
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# ================================
# MYSQL DATABASE CONFIG
# ================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/communicationdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Farukh@106}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ================================
# JPA / HIBERNATE SETTINGS
# ================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ================================
# JWT & SECURITY
# ================================
app.jwt.secret=${JWT_SECRET:MY_SUPER_SECRET_KEY_123456789012345}

# ================================
# INTER-SERVICE URLS
# ================================
auth.service.url=${AUTH_SERVICE_URL:http://localhost:8084}
student.service.url=${STUDENT_SERVICE_URL:http://localhost:8085}
faculty.service.url=${FACULTY_SERVICE_URL:http://localhost:8086}

# ================================
# LOGGING
# ================================
logging.level.org.springframework=INFO
logging.level.com.successacademy.communicationservice=INFO
