server.port=${PORT:8090}
spring.application.name=chatbot-service

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/chatbotdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Farukh@106}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Eureka Client Config
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# AI Provider Configuration (Externalized)
ai.provider=${AI_PROVIDER:openai}
ai.api-key=${AI_API_KEY:}
ai.model=${AI_MODEL:gpt-4o-mini}
ai.base-url=${AI_BASE_URL:https://api.openai.com/v1}
ai.max-tokens=1000
ai.temperature=0.3

# Microservice URLs
service.student.url=${STUDENT_SERVICE_URL:http://localhost:8085}
service.faculty.url=${FACULTY_SERVICE_URL:http://localhost:8086}
service.attendance.url=${ATTENDANCE_SERVICE_URL:http://localhost:8088}
service.fee.url=${FEE_SERVICE_URL:http://localhost:8087}
service.notice.url=${NOTICE_SERVICE_URL:http://localhost:8081}
service.event.url=${EVENT_SERVICE_URL:http://localhost:8082}
service.contact.url=${CONTACT_SERVICE_URL:http://localhost:8083}

# Logging
logging.level.com.successacademy.chatbotservice=INFO
logging.level.org.springframework.web=INFO
